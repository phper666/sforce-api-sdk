name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

      - name: Read current version
        id: version
        run: |
          BASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "base=$BASE" >> $GITHUB_OUTPUT
          VERSION=$(echo "$BASE" | sed 's/-SNAPSHOT//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compute next version
        id: next
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.version.outputs.version }}"
          case "${{ github.event.inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "next=${major}.${minor}.${patch}" >> $GITHUB_OUTPUT

      - name: Set pom to release version and tag
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.version }}
          mvn versions:commit
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "release: v${{ steps.version.outputs.version }}"
          git tag v${{ steps.version.outputs.version }}

      - name: Build with flattened POMs
        run: |
          mvn clean install -DskipTests -q

      - name: Create bundle and publish to Central Portal
        env:
          CP_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CP_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}
          NS="io/github/phper666"
          WORK="/tmp/central-bundle"
          BUNDLE="/tmp/central-bundle.zip"
          rm -rf "$WORK" "$BUNDLE"
          mkdir -p "$WORK/$NS/sforce-api-core/$VERSION"
          mkdir -p "$WORK/$NS/sforce-api-spring-boot-starter/$VERSION"

          # Copy artifacts
          for mod in sforce-api-core sforce-api-spring-boot-starter; do
            TGT="$WORK/$NS/$mod/$VERSION"
            cp "$mod/target/$mod-$VERSION.pom"       "$TGT/"
            cp "$mod/target/$mod-$VERSION.jar"        "$TGT/"
            cp "$mod/target/$mod-$VERSION-sources.jar" "$TGT/"
            cp "$mod/target/$mod-$VERSION-javadoc.jar" "$TGT/"
          done

          # GPG sign + checksums
          find "$WORK" -type f \( -name "*.jar" -o -name "*.pom" \) | while read f; do
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -ab "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done

          # Create ZIP
          cd "$WORK"
          zip -q -r "$BUNDLE" .
          cd -

          # Upload
          BEARER=$(echo -n "$CP_USERNAME:$CP_PASSWORD" | base64 -w0)
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --connect-timeout 30 --max-time 180 \
            -H "Authorization: Bearer $BEARER" \
            -F "bundle=@$BUNDLE" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Upload successful"
            cat /tmp/response.json
          else
            echo "❌ Upload failed (HTTP $HTTP_CODE)"
            cat /tmp/response.json
            exit 1
          fi

      - name: Push tag
        run: |
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Bump main branch to next SNAPSHOT
        run: |
          git fetch origin main
          git checkout main
          mvn versions:set -DnewVersion=${{ steps.next.outputs.next }}-SNAPSHOT
          mvn versions:commit
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit --allow-empty -m "chore: bump to ${{ steps.next.outputs.next }}-SNAPSHOT"
          git push origin main
